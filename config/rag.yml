# 硅基流动
chat_model_name: deepseek-v4-flash
embedding_model_name: BAAI/bge-m3                    # 1024维度

# 检索缓存配置
retrieval_cache_maxsize: 100
retrieval_cache_ttl: 600

# Rerank 配置
rerank_model_name: BAAI/bge-reranker-v2-m3
rerank_top_n: 3
# rerank_score_min: rerank 相关性分数下限（∈[0,1]，越大越相关；低于此值视为无关丢弃）
# 实测：强相关 >0.9，弱相关 0.1-0.3，不相关 <0.05
rerank_score_min: 0.05

# Query Rewrite 配置
query_rewrite_enabled: true