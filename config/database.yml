# 对话管理数据库配置
# 连接参数统一从 .env 读取(DB_HOST/DB_PORT/DB_USER/DB_PASSWORD/DB_NAME)

# 异步连接池配置
async_pool_size: 10
async_max_overflow: 10
pool_recycle: 3600
pool_pre_ping: true

# 对话管理配置
# max_messages / max_tokens: 从 DB 取出的最大历史消息条数与 token 上限。
# 注意：分层重构后已无代码读取这两个键（原读取方随旧仓储删除），保留键名以兼容既有配置；
# 上下文长度上限现由 context_max_tokens 控制（见文件末尾）。
max_messages: 8
max_tokens: 2000
llm_max_concurrency: 50

# agent_history_turns: 实际传给 ReactAgent 的历史轮数（1 轮 = 1 个 HumanMessage + 1 个 AIMessage）。
# 0 = 不传历史，每轮独立问答（默认）。解决历史污染：agent 看到上一轮 AI 回答的具体内容后
# 会复用旧话题的工具调用（如洗护问题调尺码工具），prompt 软约束对 qwen3.7-max 不可靠。
# 服装客服场景用户问题大多独立，多轮指代极少；若需指代消解（"它怎么洗"），可调为 1。
agent_history_turns: 0

# 企业级会话记忆开关。关闭后保留基础问答链路，但不读取/写入主题记忆。
conversation_memory_enabled: true
topic_router_enabled: true
long_term_memory_enabled: true
summary_enabled: true
memory_confidence_threshold: 0.8
memory_max_items: 12
topic_recent_turns: 2
context_max_tokens: 2000
